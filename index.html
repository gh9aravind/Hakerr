<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Name · Links</title>

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts: Playfair Display (display) + DM Sans (body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500&display=swap"
    rel="stylesheet"
  />

  <!-- Lucide Icons (lightweight SVG icon library) -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

  <style>
    /* ─── Custom CSS Variables & Base ─────────────────────────────── */
    :root {
      --accent:   #7dd3fc; /* sky-300 */
      --accent2:  #a78bfa; /* violet-400 */
      --glow:     rgba(125, 211, 252, 0.18);
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'DM Sans', sans-serif;
      /* Deep gradient: charcoal → midnight blue */
      background: linear-gradient(135deg, #0f0f12 0%, #0d1b2e 50%, #0a0f1e 100%);
      min-height: 100vh;
      /* Subtle noise texture overlay for depth */
      background-attachment: fixed;
    }

    /* Noise grain overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      background-size: 180px;
      pointer-events: none;
      z-index: 0;
      opacity: 0.5;
    }

    /* Ambient glow blobs in background */
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      pointer-events: none;
      z-index: 0;
      animation: drift 12s ease-in-out infinite alternate;
    }
    .blob-1 {
      width: 420px; height: 420px;
      background: rgba(125, 211, 252, 0.06);
      top: -120px; left: -80px;
    }
    .blob-2 {
      width: 340px; height: 340px;
      background: rgba(167, 139, 250, 0.07);
      bottom: -80px; right: -60px;
      animation-duration: 15s;
      animation-direction: alternate-reverse;
    }

    @keyframes drift {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(30px, 20px) scale(1.06); }
    }

    /* ─── Typography ──────────────────────────────────────────────── */
    .font-display { font-family: 'Playfair Display', serif; }

    /* ─── Profile avatar ring animation ──────────────────────────── */
    .avatar-ring {
      background: conic-gradient(
        from 0deg,
        var(--accent),
        var(--accent2),
        var(--accent)
      );
      animation: spin-ring 4s linear infinite;
      border-radius: 50%;
      padding: 3px;
    }
    @keyframes spin-ring {
      to { transform: rotate(360deg); }
    }

    /* ─── Page fade-in on load ────────────────────────────────────── */
    .page-content {
      position: relative;
      z-index: 1;
      animation: fadeUp 0.7s ease both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(22px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Stagger children */
    .stagger > * { animation: fadeUp 0.6s ease both; }
    .stagger > *:nth-child(1) { animation-delay: 0.10s; }
    .stagger > *:nth-child(2) { animation-delay: 0.18s; }
    .stagger > *:nth-child(3) { animation-delay: 0.26s; }
    .stagger > *:nth-child(4) { animation-delay: 0.34s; }
    .stagger > *:nth-child(5) { animation-delay: 0.42s; }
    .stagger > *:nth-child(6) { animation-delay: 0.50s; }

    /* ─── Glassmorphism Link Button ──────────────────────────────── */
    .link-btn {
      position: relative;
      display: flex;
      align-items: center;
      gap: 0.875rem;
      width: 100%;
      padding: 1rem 1.375rem;
      border-radius: 14px;
      text-decoration: none;
      color: #e2e8f0;
      /* Glass effect */
      background: rgba(255, 255, 255, 0.045);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      /* Transition */
      transition: transform 0.22s cubic-bezier(.34,1.56,.64,1),
                  background 0.22s ease,
                  border-color 0.22s ease,
                  box-shadow 0.22s ease;
      overflow: hidden;
    }

    /* Shimmer sweep on hover */
    .link-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        105deg,
        transparent 35%,
        rgba(255,255,255,0.06) 50%,
        transparent 65%
      );
      transform: translateX(-100%);
      transition: transform 0.5s ease;
    }

    .link-btn:hover::before {
      transform: translateX(100%);
    }

    .link-btn:hover {
      transform: scale(1.025) translateY(-2px);
      background: rgba(255, 255, 255, 0.085);
      border-color: rgba(125, 211, 252, 0.28);
      box-shadow: 0 8px 32px rgba(0,0,0,0.35), 0 0 0 1px rgba(125,211,252,0.12), inset 0 1px 0 rgba(255,255,255,0.08);
    }

    .link-btn:active {
      transform: scale(0.99) translateY(0);
    }

    /* Colored dot accent on left edge */
    .link-btn .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
      transition: transform 0.22s ease;
    }
    .link-btn:hover .dot {
      transform: scale(1.35);
    }

    .link-btn .btn-label {
      flex: 1;
      font-size: 0.9375rem;
      font-weight: 500;
      letter-spacing: 0.01em;
    }

    .link-btn .btn-arrow {
      opacity: 0;
      transform: translateX(-6px);
      transition: opacity 0.22s ease, transform 0.22s ease;
      flex-shrink: 0;
      color: var(--accent);
    }
    .link-btn:hover .btn-arrow {
      opacity: 1;
      transform: translateX(0);
    }

    /* ─── Social Icon Button ─────────────────────────────────────── */
    .social-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 44px; height: 44px;
      border-radius: 50%;
      color: #94a3b8;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.07);
      text-decoration: none;
      transition: color 0.2s ease, background 0.2s ease,
                  transform 0.22s cubic-bezier(.34,1.56,.64,1),
                  border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .social-btn:hover {
      color: #fff;
      background: rgba(255,255,255,0.11);
      border-color: rgba(255,255,255,0.2);
      transform: scale(1.18) translateY(-2px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.4);
    }

    /* ─── Divider ─────────────────────────────────────────────────── */
    .divider {
      height: 1px;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,0.08) 30%,
        rgba(255,255,255,0.08) 70%,
        transparent
      );
    }
  </style>
</head>

<body class="flex items-center justify-center px-4 py-12">

  <!-- ── Ambient background blobs ─────────────────────────────── -->
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <!-- ══════════════════════════════════════════════════════════════
       MAIN CARD
  ═══════════════════════════════════════════════════════════════ -->
  <main class="page-content w-full max-w-sm sm:max-w-md">

    <!-- ── Profile Section ──────────────────────────────────────── -->
    <header class="flex flex-col items-center text-center mb-9">

      <!-- Profile picture with spinning gradient ring -->
      <div class="avatar-ring mb-4" style="width:92px;height:92px;">
        <div style="width:86px;height:86px;border-radius:50%;overflow:hidden;background:#1e293b;margin:auto;margin-top:0;">
          <!--
            REPLACE: swap the src below with your own photo URL.
            Example: src="https://example.com/your-photo.jpg"
          -->
          <img
            src="https://api.dicebear.com/8.x/shapes/svg?seed=linktree&backgroundColor=0f172a"
            alt="Profile photo"
            style="width:100%;height:100%;object-fit:cover;"
            onerror="this.style.display='none'"
          />
        </div>
      </div>

      <!-- Name — REPLACE with your own -->
      <h1 class="font-display text-2xl sm:text-3xl font-bold text-white tracking-tight mb-1">
        Alex Rivera
      </h1>

      <!-- Handle / tagline — REPLACE -->
      <p class="text-sky-400 text-sm font-medium tracking-widest uppercase mb-3">
        @alexrivera
      </p>

      <!-- Bio — REPLACE -->
      <p class="text-slate-400 text-sm sm:text-[0.9375rem] leading-relaxed max-w-xs">
        Designer &amp; developer crafting digital experiences.<br/>
        Open to collaborations ✦ Based in Lisbon 🌊
      </p>

    </header>

    <!-- ── Link Buttons ──────────────────────────────────────────── -->
    <!--
      HOW TO ADD / EDIT LINKS:
        1. Duplicate any <a class="link-btn"> block.
        2. Change href="..." to your URL.
        3. Change the dot color (bg-sky-400 / bg-violet-400 / etc.).
        4. Update the label text inside .btn-label.
    -->
    <nav class="stagger flex flex-col gap-3 mb-8" aria-label="Links">

      <!-- Link 1 -->
      <a href="https://your-portfolio.com" target="_blank" rel="noopener" class="link-btn">
        <span class="dot bg-sky-400"></span>
        <span class="btn-label">🎨 &nbsp;Portfolio &amp; Work</span>
        <i data-lucide="arrow-right" class="btn-arrow" style="width:16px;height:16px;"></i>
      </a>

      <!-- Link 2 -->
      <a href="https://your-blog.com" target="_blank" rel="noopener" class="link-btn">
        <span class="dot bg-violet-400"></span>
        <span class="btn-label">✍️ &nbsp;Blog &amp; Articles</span>
        <i data-lucide="arrow-right" class="btn-arrow" style="width:16px;height:16px;"></i>
      </a>

      <!-- Link 3 -->
      <a href="https://your-newsletter.com" target="_blank" rel="noopener" class="link-btn">
        <span class="dot bg-emerald-400"></span>
        <span class="btn-label">📬 &nbsp;Weekly Newsletter</span>
        <i data-lucide="arrow-right" class="btn-arrow" style="width:16px;height:16px;"></i>
      </a>

      <!-- Link 4 -->
      <a href="https://your-course.com" target="_blank" rel="noopener" class="link-btn">
        <span class="dot bg-amber-400"></span>
        <span class="btn-label">🚀 &nbsp;Free Design Course</span>
        <i data-lucide="arrow-right" class="btn-arrow" style="width:16px;height:16px;"></i>
      </a>

      <!-- Link 5 -->
      <a href="https://cal.com/your-handle" target="_blank" rel="noopener" class="link-btn">
        <span class="dot bg-rose-400"></span>
        <span class="btn-label">📅 &nbsp;Book a 1:1 Call</span>
        <i data-lucide="arrow-right" class="btn-arrow" style="width:16px;height:16px;"></i>
      </a>

      <!-- Link 6 -->
      <a href="https://your-shop.com" target="_blank" rel="noopener" class="link-btn">
        <span class="dot bg-teal-400"></span>
        <span class="btn-label">🛍️ &nbsp;Design Templates Shop</span>
        <i data-lucide="arrow-right" class="btn-arrow" style="width:16px;height:16px;"></i>
      </a>

    </nav>

    <!-- ── Divider ───────────────────────────────────────────────── -->
    <div class="divider mb-7"></div>

    <!-- ── Social Icons ──────────────────────────────────────────── -->
    <!--
      HOW TO EDIT SOCIAL LINKS:
        Replace href="..." with your own profile URLs.
        Available Lucide icons: instagram, github, youtube, twitter, linkedin, twitch, etc.
    -->
    <footer class="flex items-center justify-center gap-3 mb-8">

      <!-- Instagram -->
      <a href="https://instagram.com/your-handle" target="_blank" rel="noopener"
         class="social-btn" aria-label="Instagram">
        <!-- Using inline SVG for Instagram since Lucide doesn't include it -->
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
          <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/>
          <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/>
        </svg>
      </a>

      <!-- GitHub -->
      <a href="https://github.com/your-handle" target="_blank" rel="noopener"
         class="social-btn" aria-label="GitHub">
        <i data-lucide="github" style="width:18px;height:18px;"></i>
      </a>

      <!-- YouTube -->
      <a href="https://youtube.com/@your-channel" target="_blank" rel="noopener"
         class="social-btn" aria-label="YouTube">
        <i data-lucide="youtube" style="width:18px;height:18px;"></i>
      </a>

      <!-- X / Twitter -->
      <a href="https://x.com/your-handle" target="_blank" rel="noopener"
         class="social-btn" aria-label="X / Twitter">
        <i data-lucide="twitter" style="width:18px;height:18px;"></i>
      </a>

      <!-- WhatsApp -->
      <a href="https://wa.me/1234567890" target="_blank" rel="noopener"
         class="social-btn" aria-label="WhatsApp">
        <!-- Inline WhatsApp SVG -->
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
        </svg>
      </a>

      <!-- LinkedIn -->
      <a href="https://linkedin.com/in/your-handle" target="_blank" rel="noopener"
         class="social-btn" aria-label="LinkedIn">
        <i data-lucide="linkedin" style="width:18px;height:18px;"></i>
      </a>

    </footer>

    <!-- ── Footer credit ─────────────────────────────────────────── -->
    <p class="text-center text-slate-600 text-xs">
      Built with ♥ &nbsp;·&nbsp; 2026
    </p>

  </main>

  <!-- Initialise Lucide icons -->
  <script>
    lucide.createIcons();
  </script>

</body>
</html>
